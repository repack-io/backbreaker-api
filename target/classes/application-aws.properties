spring.config.import=aws-secretsmanager:${DB_SECRET_NAME}

spring.datasource.url=jdbc:postgresql://${host}:${port}/${dbname}
spring.datasource.username=${username}
spring.datasource.password=${password}

# Connection pool settings to prevent long hangs
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# Optimize connection pool for faster startup
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# Optimize JPA/Hibernate for faster startup
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Lazy initialization for faster startup (beans created on-demand)
spring.main.lazy-initialization=true

# Actuator configuration for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# Enhanced logging for debugging
logging.level.org.springframework.cloud.aws.secretsmanager=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.hibernate.engine.jdbc.env.internal.LobCreatorBuilderImpl=WARN
logging.level.com.repackio.backbreaker=INFO
