spring.config.import=aws-secretsmanager:${DB_SECRET_NAME}

spring.datasource.url=jdbc:postgresql://${host}:${port}/${dbname}
spring.datasource.username=${username}
spring.datasource.password=${password}

# Connection pool settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# Production connection pool settings
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# Optimize JPA/Hibernate
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Production - no lazy initialization for consistent performance
spring.main.lazy-initialization=false

# Actuator configuration for health checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# AWS resources - PRODUCTION environment
aws.s3.uploadsBucket=repackio-uploads-prd
aws.s3.processedBucket=repackio-processed-prd

# Production logging - less verbose
logging.level.org.springframework.cloud.aws.secretsmanager=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.hibernate.engine.jdbc.env.internal.LobCreatorBuilderImpl=WARN
logging.level.com.repackio.backbreaker=INFO

# Label URL - PRODUCTION environment
url.labelsheet=https://www.repacks.io

