spring.application.name=backbreaker

# Default to local-dev profile if none specified
spring.profiles.default=local-dev

aws.region=us-east-2

logging.level.org.springframework.web=DEBUG

# Card token security - HMAC secret for signing QR code tokens
# IMPORTANT: Override this in each environment with a unique secret
card.token.secret=default-secret-change-me-in-production

# ===========================================
# BEDROCK MODEL CONFIGURATION
# ===========================================

# Default model used when no specific model is configured for a use case
bedrock.default-model-id=us.anthropic.claude-haiku-4-5-20251001-v1:0

# Default parameters (can be overridden per use case)
bedrock.max-tokens=1024
bedrock.temperature=0.1
bedrock.prompts-path=file:prompts/

# Named model presets for easy switching
# Usage: Set bedrock.default-model-id=claude-sonnet or bedrock.models.card-analysis.model-id=llama3
bedrock.presets.claude-sonnet=us.anthropic.claude-sonnet-4-5-20250929-v1:0
bedrock.presets.claude-haiku=us.anthropic.claude-3-5-haiku-20241022-v1:0
bedrock.presets.llama3-90b=us.meta.llama3-2-90b-instruct-v1:0
bedrock.presets.llama3-11b=us.meta.llama3-2-11b-instruct-v1:0
bedrock.presets.llama3-vision=us.meta.llama3-2-90b-vision-instruct-v1:0

# Use case specific model configurations
# Each use case can have its own model, maxTokens, and temperature
# If not specified, falls back to defaults above

# Card analysis (image processing for cropping)
bedrock.models.card-analysis.model-id=us.anthropic.claude-haiku-4-5-20251001-v1:0
bedrock.models.card-analysis.max-tokens=1024
bedrock.models.card-analysis.temperature=0.1

# Example: Text generation use case (uncomment to use)
# bedrock.models.text-generation.model-id=llama3-90b
# bedrock.models.text-generation.max-tokens=2048
# bedrock.models.text-generation.temperature=0.7

# Image cropping configuration
bedrock.confidence.threshold=70.0
bedrock.crop.padding=10

aws.sqs.enabled=true