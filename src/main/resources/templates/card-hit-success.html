<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Hit Successfully!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 900px;
            width: 100%;
            text-align: center;
        }
        .success-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 0.6s ease-out;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        h1 {
            color: #2d3748;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .player-name {
            color: #667eea;
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 30px;
        }
        .card-images {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        .card-image-container {
            flex: 1;
            min-width: 300px;
            max-width: 400px;
        }
        .card-label {
            font-size: 1.2rem;
            color: #4a5568;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .card-image {
            width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }
        .card-image:hover {
            transform: scale(1.05);
        }
        .message {
            color: #4a5568;
            font-size: 1.2rem;
            margin-top: 30px;
            line-height: 1.6;
        }
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            .player-name {
                font-size: 1.5rem;
            }
            .card-images {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>RepackIO</h1>
        <div class="player-name">{{PLAYER_NAME}}</div>

        <div class="card-images">
            <div class="card-image-container">
                <div class="card-label">Front</div>
                <img src="{{FRONT_IMG_URL}}" alt="Card Front" class="card-image">
            </div>
            <div class="card-image-container">
                <div class="card-label">Back</div>
                <img src="{{BACK_IMG_URL}}" alt="Card Back" class="card-image">
            </div>
        </div>

        <div class="message">
            This card has been marked as hit.
        </div>
    </div>
</body>
</html>
