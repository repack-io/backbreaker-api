spring.config.import=aws-secretsmanager:${DB_SECRET_NAME}

spring.datasource.url=jdbc:postgresql://repackio-dev-postgres.cbomoa44gw21.us-east-2.rds.amazonaws.com:5432/repackio_dev
spring.datasource.username=repackio_admin_dev
spring.datasource.password=WisconsinBand1994

# Connection pool settings to prevent long hangs
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# Optimize connection pool for faster startup
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# Optimize JPA/Hibernate for faster startup
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Lazy initialization for faster startup (beans created on-demand)
spring.main.lazy-initialization=true

# Actuator configuration for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# AWS resources - DEV environment
aws.s3.uploadsBucket=repackio-uploads-dev
aws.s3.processedBucket=repackio-processed-dev

# Enhanced logging for debugging
logging.level.org.springframework.cloud.aws.secretsmanager=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.hibernate.engine.jdbc.env.internal.LobCreatorBuilderImpl=WARN
logging.level.com.repackio.backbreaker=INFO

# Label URL - DEV environment
url.labelsheet=http://backbreaker-dev.eba-pbmzp5ft.us-east-2.elasticbeanstalk.com

